# All commands run in this container; nothing is installed on the host.
#   docker compose up                          # dev server: http://localhost:8080/app/
#   docker compose run --rm node npm test      # build + tests (Chromium / Firefox / WebKit)
services:
  node:
    # Official Playwright image (Node.js + browsers). Pinned by digest; keep the version
    # in sync with @playwright/test in package.json.
    image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    working_dir: /work
    init: true
    volumes:
      - .:/work
      - node_modules:/work/node_modules # keep Linux node_modules off the host
    ports:
      - 127.0.0.1:8080:8080
    command: sh -c "npm ci && npm run samples && npm run dev"

volumes:
  node_modules:
